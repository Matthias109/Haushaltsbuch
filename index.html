<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<title>Haushaltsbuch</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#1d2621;--muted:#66736c;--line:#e0e6e3;--brand:#2f6f5e;--brand2:#e2efea;--inc:#1d8248;--exp:#c0392b;--warn:#a86a12;--warnbg:#fdf3e1}
@media (prefers-color-scheme:dark){:root{--bg:#111513;--card:#1b211f;--text:#e5ebe8;--muted:#93a29a;--line:#2b3431;--brand:#5fb79c;--brand2:#1f322b;--inc:#4cc77f;--exp:#ef6b5c;--warn:#e8b04f;--warnbg:#33281a}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#2f6f5e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:650}
#status{font-size:12px;border:0;border-radius:99px;padding:4px 10px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
#status.err{background:#c0392b}
main{max-width:900px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 9px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:650}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.big{font-size:24px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:560;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand2);color:var(--brand);margin-left:4px;vertical-align:1px}
.badge.w{background:var(--warnbg);color:var(--warn)}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ghead h3{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar>*{flex:1 1 140px}
button.btn,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.del{color:var(--exp)}
.btn.sm{padding:4px 10px;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;border-radius:99px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:3px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text)}
label.chk input{width:auto;margin-top:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.seg label{flex:1;margin:0;text-align:center;padding:9px 4px;cursor:pointer;color:var(--text);font-size:14px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--brand);color:#fff;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);background:var(--brand2);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal form{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:600px){#modal{align-items:center}#modal form{border-radius:16px}}
.mfoot{display:flex;gap:8px;margin-top:6px}.mfoot .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;border-top:0}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}
tr.det td{background:var(--bg);font-size:13px}
.neg{color:var(--exp);font-weight:650}
svg text{fill:var(--muted);font-size:11px}
.mhead{display:flex;justify-content:space-between;font-weight:600;margin:14px 0 4px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px 0}
</style>
</head>
<body>
<header><h1>Haushaltsbuch</h1><button id="status" onclick="go('set')">lokal</button></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
'use strict';
/* ================= Grundlagen ================= */
const LS_DATA='hb_data_v1', LS_CFG='hb_cfg_v1';
const KEYS=['accounts','groups','orders','bookings'];
const FREQ={once:{l:'Einmalig',m:0},m1:{l:'Monatlich',m:1},m2:{l:'Alle 2 Monate',m:2},m3:{l:'Quartalsweise',m:3},m4:{l:'Alle 4 Monate',m:4},m6:{l:'Halbjährlich',m:6},m12:{l:'Jährlich',m:12}};
const MON=['Jan','Feb','März','Apr','Mai','Juni','Juli','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const chf=new Intl.NumberFormat('de-CH',{style:'currency',currency:'CHF'});
const fmt=v=>chf.format(Math.round(v*100)/100);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const parse=iso=>{const[y,m,d]=iso.split('-').map(Number);return{y,m,d}};
function addMonths(iso,n,day){const p=parse(iso);const t=p.y*12+(p.m-1)+n;const y=Math.floor(t/12),m=t%12+1;const dim=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(Math.min(day??p.d,dim))}
function addDays(iso,n){const p=parse(iso);return isoOf(new Date(p.y,p.m-1,p.d+n))}
const dmy=iso=>{if(!iso)return'';const p=parse(iso);return pad(p.d)+'.'+pad(p.m)+'.'+p.y};
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return MONL[m-1]+' '+y};
const maxD=(a,b)=>!a?b||null:!b?a:(a>b?a:b);
function parseAmount(s){const v=parseFloat(String(s??'').replace(/['’\s]/g,'').replace(',','.'));return isNaN(v)?NaN:Math.round(v*100)/100}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ================= Daten ================= */
function seedData(){
  // feste IDs, damit sich die Startdaten auf zwei Geräten nicht verdoppeln
  const g=(id,name,type,color)=>({id,name,type,color,updatedAt:0});
  return {version:1,
    accounts:[{id:'seed_acc',name:'Haushaltskonto',startBalance:0,startDate:today(),updatedAt:0}],
    groups:[g('seed_g_ein','Einnahmen','einnahme','#1d8248'),g('seed_g_wohn','Wohnen','ausgabe','#2f6fb5'),g('seed_g_vers','Versicherungen','ausgabe','#8e44ad'),g('seed_g_steu','Steuern','ausgabe','#c0392b'),g('seed_g_mob','Mobilität','ausgabe','#d68910'),g('seed_g_alltag','Alltag & Freizeit','ausgabe','#16a085')],
    orders:[],bookings:[]};
}
let data;
try{data=JSON.parse(lsGet(LS_DATA))}catch(e){}
if(!data||!data.accounts)data=seedData();
for(const k of KEYS)data[k]=data[k]||[];
if(!data.groups.some(g=>g.id==='seed_g_spar'))data.groups.push({id:'seed_g_spar',name:'Sparen',type:'gemischt',color:'#b7950b',updatedAt:0});
let cfg={};try{cfg=JSON.parse(lsGet(LS_CFG))||{}}catch(e){}

const live=arr=>arr.filter(x=>!x.deleted);
const liveAcc=()=>live(data.accounts);
const liveGroups=()=>live(data.groups).sort((a,b)=>(a.type==='einnahme'?0:1)-(b.type==='einnahme'?0:1)||a.name.localeCompare(b.name));
const groupById=id=>data.groups.find(g=>g.id===id&&!g.deleted);
const accById=id=>data.accounts.find(a=>a.id===id&&!a.deleted);
const gName=id=>groupById(id)?.name||'Ohne Gruppe';
const gColor=id=>groupById(id)?.color||'#999';
const aName=id=>accById(id)?.name||'–';
const val=x=>x.kind==='einnahme'?+x.amount:x.kind==='transfer'?0:-x.amount;
const isTr=x=>x.kind==='transfer';
const inSet=(x,set)=>set.has(x.accountId)||(isTr(x)&&set.has(x.toAccountId));
// Betrag aus Sicht einer Kontenauswahl: Übertrag = minus beim Absender, plus beim Empfänger
function sval(x,set){if(!isTr(x))return set.has(x.accountId)?val(x):0;let v=0;if(set.has(x.accountId))v-=+x.amount;if(set.has(x.toAccountId))v+=+x.amount;return v}
const accLine=x=>isTr(x)?esc(aName(x.accountId))+' → '+esc(aName(x.toAccountId)):(liveAcc().length>1?esc(aName(x.accountId)):'');
const money=(v,x,tag='div')=>isTr(x)&&v===0?`<${tag} class="num muted">⇄ ${fmt(x.amount)}</${tag}>`:`<${tag} class="num ${v<0?'exp':'inc'}">${fmt(v)}</${tag}>`;

/* ================= Daueraufträge: Termine ================= */
function occ(o,from,to){
  const res=[];if(!o.startDate)return res;
  const end=o.endDate&&o.endDate<to?o.endDate:to;
  if(o.freq==='once'){if(o.startDate>=from&&o.startDate<=end)res.push(o.startDate);return res}
  const n=FREQ[o.freq]?.m||1,sd=parse(o.startDate).d;
  for(let k=0;k<5000;k++){const d=addMonths(o.startDate,k*n,sd);if(d>end)break;if(d>=from)res.push(d)}
  return res;
}
const nextOcc=(o,from)=>occ(o,from,addMonths(from,25))[0]||null;

// fällige Ausführungen bis heute als Buchungen festschreiben (Vergangenheit bleibt danach unverändert)
function materialize(){
  const t=today();const ids=new Set(data.bookings.map(b=>b.id));let ch=false;
  for(const o of data.orders){
    if(o.deleted||(o.bookedUntil&&o.bookedUntil>=t))continue;
    const from=o.bookedUntil?addDays(o.bookedUntil,1):o.startDate;
    for(const d of occ(o,from,t)){
      const id='o_'+o.id+'_'+d;
      if(!ids.has(id)){data.bookings.push({id,date:d,title:o.title,kind:o.kind,amount:o.amount,groupId:o.groupId,accountId:o.accountId,toAccountId:o.toAccountId||'',orderId:o.id,note:'',by:'Dauerauftrag',updatedAt:now()});ids.add(id)}
    }
    o.bookedUntil=t;ch=true;
  }
  return ch;
}

/* ================= Saldo & Prognose ================= */
function balanceOf(accSet,upTo){
  let s=0;const st={};
  for(const a of liveAcc())if(accSet.has(a.id)){s+=+a.startBalance||0;st[a.id]=a.startDate||'0000'}
  for(const b of data.bookings){
    if(b.deleted||b.date>upTo)continue;
    if(accSet.has(b.accountId)&&b.date>=st[b.accountId])s+=isTr(b)?-b.amount:val(b);
    if(isTr(b)&&accSet.has(b.toAccountId)&&b.date>=st[b.toAccountId])s+=+b.amount;
  }
  return s;
}
function accSetOf(accId){return accId?new Set([accId]):new Set(liveAcc().map(a=>a.id))}
function forecast(accId,months){
  const t=today(),sm=t.slice(0,8)+'01',endISO=addDays(addMonths(sm,months),-1),set=accSetOf(accId),from=addDays(t,1),ev=[];
  for(const b of data.bookings)if(!b.deleted&&b.date>t&&b.date<=endISO&&inSet(b,set))ev.push({date:b.date,title:b.title,v:sval(b,set),groupId:b.groupId,type:'b',id:b.id,kind:b.kind,amount:b.amount,accountId:b.accountId,toAccountId:b.toAccountId});
  for(const o of data.orders)if(!o.deleted&&inSet(o,set))for(const d of occ(o,from,endISO))ev.push({date:d,title:o.title,v:sval(o,set),groupId:o.groupId,type:'o',id:o.id,freq:o.freq,kind:o.kind,amount:o.amount,accountId:o.accountId,toAccountId:o.toAccountId});
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const start=balanceOf(set,t);let run=start,min={v:start,date:t},i=0;const rows=[];
  for(let k=0;k<months;k++){
    const ym=addMonths(sm,k).slice(0,7),row={ym,inc:0,exp:0,items:[]};
    while(i<ev.length&&ev[i].date.slice(0,7)===ym){const e=ev[i++];if(e.v>=0)row.inc+=e.v;else row.exp+=e.v;run+=e.v;row.items.push(e);if(run<min.v)min={v:run,date:e.date}}
    row.end=run;rows.push(row);
  }
  return{start,rows,min,ev,end:run};
}

/* ================= Speichern & Sync (GitHub) ================= */
let remoteSha=null,busy=false,pending=false,pushTimer=null,lastSync=null,syncErr='';
const syncOn=()=>!!(cfg.owner&&cfg.repo&&cfg.token);
function saveLocal(){lsSet(LS_DATA,JSON.stringify(data))}
function commit(){saveLocal();render();clearTimeout(pushTimer);pushTimer=setTimeout(syncNow,800)}
function setStatus(){
  const el=document.getElementById('status');el.className='';
  if(!syncOn()){el.textContent='nur dieses Gerät';return}
  if(busy){el.textContent='synchronisiere …';return}
  if(syncErr){el.textContent='Sync-Fehler';el.className='err';return}
  el.textContent=lastSync?'✓ '+pad(lastSync.getHours())+':'+pad(lastSync.getMinutes()):'verbunden';
}
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
function ghUrl(){return'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+(cfg.path||'daten.json').split('/').map(encodeURIComponent).join('/')}
const ghHdr=()=>({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'});
async function ghGet(){
  const r=await fetch(ghUrl()+'?ref='+encodeURIComponent(cfg.branch||'main')+'&_='+now(),{headers:ghHdr(),cache:'no-store'});
  if(r.status===404)return null;
  if(r.status===401)throw new Error('Token ungültig oder abgelaufen (401).');
  if(!r.ok)throw new Error('GitHub meldet '+r.status+': '+(await r.text()).slice(0,160));
  const j=await r.json();return{sha:j.sha,data:JSON.parse(b64dec(j.content))};
}
async function ghPut(obj,sha){
  const body={message:'Haushaltsbuch: Änderung'+(cfg.name?' von '+cfg.name:''),content:b64enc(JSON.stringify(obj)),branch:cfg.branch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghHdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false; // jemand anders hat gleichzeitig gespeichert → neu zusammenführen
  if(!r.ok)throw new Error('Speichern fehlgeschlagen ('+r.status+'): '+(await r.text()).slice(0,160));
  const j=await r.json();remoteSha=j.content?.sha;return true;
}
function merge(a,b){
  const out={version:1};
  for(const k of KEYS){
    const m=new Map();for(const x of a[k]||[])m.set(x.id,x);
    for(const y of b[k]||[]){
      const x=m.get(y.id);
      let w=!x||(y.updatedAt||0)>(x.updatedAt||0)?y:x;
      if(k==='orders'&&x)w={...w,bookedUntil:maxD(x.bookedUntil,y.bookedUntil)};
      m.set(y.id,w);
    }
    out[k]=[...m.values()];
  }
  return out;
}
const canon=d=>JSON.stringify(KEYS.map(k=>[...(d[k]||[])].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0)));
async function syncNow(){
  if(!syncOn()){materialize()&&saveLocal();return}
  if(busy){pending=true;return}
  busy=true;setStatus();
  try{
    for(let i=0;i<5;i++){
      const remote=await ghGet();
      data=remote?merge(data,remote.data):data;
      materialize();
      if(remote&&canon(data)===canon(remote.data)){remoteSha=remote.sha;break}
      if(await ghPut(data,remote?.sha))break;
      if(i===4)throw new Error('Konnte nach mehreren Versuchen nicht speichern.');
    }
    saveLocal();syncErr='';lastSync=new Date();
    if(!document.querySelector('#modal.open'))render();
  }catch(e){syncErr=e.message||String(e)}
  busy=false;setStatus();
  if(tab==='set')render();
  if(pending){pending=false;syncNow()}
}
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});

/* ================= Navigation ================= */
let tab='home';
const TABS=[['home','🏠','Übersicht'],['book','📒','Buchungen'],['orders','🔁','Daueraufträge'],['fc','📈','Prognose'],['set','⚙️','Einstellungen']];
const ui={q:'',fg:'',fa:'',showEnded:false,fcAcc:null,fcMonths:1,open:{}};
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  const v=document.getElementById('view');
  v.innerHTML={home:vHome,book:vBook,orders:vOrders,fc:vForecast,set:vSettings}[tab]();
  setStatus();
}

/* ================= Ansicht: Übersicht ================= */
function vHome(){
  const t=today();let h='';
  const f=forecast('',12);
  if(f.min.v<0)h+=`<div class="warnbox">⚠️ Laut Prognose wird der Gesamtstand am <b>${dmy(f.min.date)}</b> mit <b>${fmt(f.min.v)}</b> negativ.</div>`;
  h+='<div class="grid2">';
  for(const a of liveAcc()){
    const s=accSetOf(a.id),bal=balanceOf(s,t),fa=forecast(a.id,12);
    h+=`<div class="card"><div class="muted small">${esc(a.name)}</div><div class="big ${bal<0?'exp':''}">${fmt(bal)}</div><div class="small muted">in 12 Monaten: <b class="${fa.end<0?'exp':''}">${fmt(fa.end)}</b></div></div>`;
  }
  if(liveAcc().length>1)h+=`<div class="card"><div class="muted small">Alle Konten</div><div class="big">${fmt(f.start)}</div><div class="small muted">in 12 Monaten: <b>${fmt(f.end)}</b></div></div>`;
  h+='</div>';
  // dieser Monat
  const ym=t.slice(0,7);let inc=0,exp=0;
  for(const b of live(data.bookings))if(b.date.slice(0,7)===ym&&b.date<=t&&!isTr(b)&&accById(b.accountId)){const v=val(b);v>=0?inc+=v:exp+=v}
  const rest=f.rows[0];
  h+=`<div class="card"><h3>${ymLabel(ym)}</h3><table>
   <tr><td>Bisher eingegangen</td><td class="num inc">${fmt(inc)}</td></tr>
   <tr><td>Bisher ausgegeben</td><td class="num exp">${fmt(exp)}</td></tr>
   <tr><td>Noch geplant bis Monatsende</td><td class="num">${fmt(rest.inc+rest.exp)}</td></tr>
   <tr><td><b>Stand Ende Monat</b></td><td class="num"><b>${fmt(rest.end)}</b></td></tr></table></div>`;
  // nächste 30 Tage
  const lim=addDays(t,30),up=f.ev.filter(e=>e.date<=lim);
  h+=`<div class="card"><h3>Nächste 30 Tage</h3>${up.length?up.map(evRow).join(''):'<div class="empty">Nichts geplant.</div>'}</div>`;
  return h;
}
function evRow(e){
  const click=e.type==='o'?`editOrder('${e.id}')`:`editBooking('${e.id}')`;

/* ================= Ansicht: Buchungen ================= */
function vBook(){
  const t=today(),q=ui.q.toLowerCase();
  let list=live(data.bookings).filter(b=>(!ui.fg||b.groupId===ui.fg||(ui.fg==='-'&&!groupById(b.groupId)))&&(!ui.fa||inSet(b,new Set([ui.fa])))&&(!q||(b.title+' '+(b.note||'')).toLowerCase().includes(q)));
  list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  let h=`<h2>Buchungen</h2><div class="bar">
   <input placeholder="Suchen …" value="${esc(ui.q)}" oninput="ui.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)">
   <select onchange="ui.fg=this.value;render()"><option value="">Alle Gruppen</option>${liveGroups().map(g=>`<option value="${g.id}" ${ui.fg===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}<option value="-" ${ui.fg==='-'?'selected':''}>Ohne Gruppe</option></select>
   ${liveAcc().length>1?`<select onchange="ui.fa=this.value;render()"><option value="">Alle Konten</option>${liveAcc().map(a=>`<option value="${a.id}" ${ui.fa===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}
  </div>`;
  if(!list.length)h+='<div class="card empty">Noch keine Buchungen. Tippe unten auf „+ Buchung“.</div>';
  let cur='',sum=0,buf='';const bset=accSetOf(ui.fa);
  const flush=()=>{if(cur)h+=`<div class="mhead"><span>${ymLabel(cur)}</span><span class="num ${sum<0?'exp':'inc'}">${fmt(sum)}</span></div><div class="card">${buf}</div>`};
  for(const b of list.slice(0,ui.limit||400)){
    const ym=b.date.slice(0,7);if(ym!==cur){flush();cur=ym;sum=0;buf=''}
    sum+=sval(b,bset);
    buf+=`<div class="item" onclick="editBooking('${b.id}')"><span class="dot" style="background:${gColor(b.groupId)}"></span><div class="t"><b>${esc(b.title)}${b.date>t?'<span class="badge w">geplant</span>':''}${b.orderId?'<span class="badge">DA</span>':''}</b><span class="small muted">${dmy(b.date)} · ${esc(gName(b.groupId))}${accLine(b)?' · '+accLine(b):''}${b.note?' · '+esc(b.note):''}</span></div>${money(sval(b,bset),b)}</div>`;
  }
  flush();
  if(list.length>(ui.limit||400))h+=`<button class="btn" style="width:100%" onclick="ui.limit=(ui.limit||400)+400;render()">Ältere anzeigen</button>`;
  h+=`<button class="btn pri fab" onclick="editBooking()">+ Buchung</button>`;
  return h;
}

/* ================= Ansicht: Daueraufträge nach Gruppen ================= */
function vOrders(){
  const t=today();
  const all=live(data.orders),isEnded=o=>(o.endDate&&o.endDate<t)||(o.freq==='once'&&o.startDate<t);
  const shown=all.filter(o=>ui.showEnded||!isEnded(o));
  let h=`<h2>Daueraufträge &amp; geplante Zahlungen</h2>
   <div class="bar"><button class="btn" onclick="editGroup()">+ Gruppe</button><button class="btn" onclick="ui.showEnded=!ui.showEnded;render()">${ui.showEnded?'Beendete ausblenden':'Beendete anzeigen'}</button></div>`;
  let totM=0,trM=0;
  const sections=[...liveGroups().map(g=>({g,items:shown.filter(o=>o.groupId===g.id)})),{g:null,items:shown.filter(o=>!groupById(o.groupId))}];
  for(const {g,items} of sections){
    if(!g&&!items.length)continue;
    items.sort((a,b)=>a.title.localeCompare(b.title));
    let m=0;for(const o of items)if(!isEnded(o)&&o.freq!=='once'){if(isTr(o))trM+=o.amount/FREQ[o.freq].m;else m+=val(o)/FREQ[o.freq].m}
    totM+=m;
    h+=`<div class="card"><div class="ghead"><span class="dot" style="background:${g?g.color:'#999'}"></span><h3>${esc(g?g.name:'Ohne Gruppe')}</h3><span class="small muted num">Ø ${fmt(m)}/Mt.</span>${g?`<button class="btn sm" onclick="editGroup('${g.id}')">✎</button>`:''}</div>`;
    if(!items.length)h+='<div class="small muted" style="padding:6px 0">Noch keine Einträge.</div>';
    for(const o of items){
      const nx=nextOcc(o,t);
      h+=`<div class="item" onclick="editOrder('${o.id}')"><div class="t"><b>${esc(o.title)}${isEnded(o)?'<span class="badge w">beendet</span>':''}</b><span class="small muted">${FREQ[o.freq].l}${nx?' · nächste: '+dmy(nx):''}${o.endDate&&!isEnded(o)?' · bis '+dmy(o.endDate):''}${accLine(o)?' · '+accLine(o):''}</span></div>${money(val(o),o)}</div>`;
    }
    if(g)h+=`<button class="btn sm" style="margin-top:6px" onclick="editOrder(null,'${g.id}')">+ Eintrag in ${esc(g.name)}</button>`;
    h+='</div>';
  }
  h+=`<div class="card"><table><tr><td><b>Monatlicher Durchschnitt aller Daueraufträge</b></td><td class="num ${totM<0?'exp':'inc'}"><b>${fmt(totM)}</b></td></tr>${trM?`<tr><td>Davon nicht enthalten: Überträge zwischen Konten (Sparen)</td><td class="num muted">⇄ ${fmt(trM)}</td></tr>`:''}</table><div class="small muted">Quartals-, Halbjahres- und Jahreszahlungen sind auf den Monat umgerechnet. Einmalige Zahlungen zählen nicht.</div></div>`;
  h+=`<button class="btn pri fab" onclick="editOrder()">+ Dauerauftrag</button>`;
  return h;
}

/* ================= Ansicht: Prognose ================= */
function vForecast(){
  if(ui.fcAcc===null||(ui.fcAcc&&!accById(ui.fcAcc))){const hk=liveAcc().find(a=>/haushalt/i.test(a.name))||liveAcc()[0];ui.fcAcc=hk?hk.id:''}
  const f=forecast(ui.fcAcc,ui.fcMonths);
  let h=`<h2>Prognose</h2><div class="bar">
   ${liveAcc().length>1?`<select onchange="ui.fcAcc=this.value;render()"><option value="">Alle Konten</option>${liveAcc().map(a=>`<option value="${a.id}" ${ui.fcAcc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}
   <select onchange="ui.fcMonths=+this.value;render()">${[[1,'Bis Ende Monat'],[2,'Bis Ende nächster Monat'],[6,'6 Monate'],[12,'12 Monate'],[24,'24 Monate'],[36,'36 Monate']].map(([n,l])=>`<option value="${n}" ${ui.fcMonths===n?'selected':''}>${l}</option>`).join('')}</select></div>`;
  if(f.min.v<0)h+=`<div class="warnbox">⚠️ Tiefster Stand: <b>${fmt(f.min.v)}</b> am ${dmy(f.min.date)}</div>`;
  h+=`<div class="grid2"><div class="card"><div class="muted small">Stand heute</div><div class="big">${fmt(f.start)}</div></div>
   <div class="card"><div class="muted small">Stand Ende ${ymLabel(f.rows[f.rows.length-1].ym)}</div><div class="big ${f.end<0?'exp':''}">${fmt(f.end)}</div></div></div>`;
  h+=`<div class="card">${chartSvg(f)}</div>`;
  h+=`<div class="card"><table><tr><th>Monat</th><th>Einnahmen</th><th>Ausgaben</th><th>Stand</th></tr>`;
  for(const r of f.rows){
    const op=ui.open[r.ym];
    h+=`<tr class="click" onclick="ui.open['${r.ym}']=!ui.open['${r.ym}'];render()"><td>${op?'▾':'▸'} ${MON[+r.ym.slice(5)-1]} ${r.ym.slice(2,4)}</td><td class="num inc">${r.inc?fmt(r.inc):'–'}</td><td class="num exp">${r.exp?fmt(r.exp):'–'}</td><td class="num ${r.end<0?'neg':''}">${fmt(r.end)}</td></tr>`;
    if(op)h+=`<tr class="det"><td colspan="4">${r.items.length?r.items.map(e=>`<div style="display:flex;gap:8px;padding:2px 0"><span class="muted">${dmy(e.date).slice(0,6)}</span><span style="flex:1">${esc(e.title)} <span class="muted">· ${esc(gName(e.groupId))}</span></span>${money(e.v,e,'span')}</div>`).join(''):'<span class="muted">Keine Zahlungen geplant.</span>'}</td></tr>`;
  }
  h+='</table></div>';
  // nach Gruppen
  const byG={};for(const e of f.ev){if(isTr(e)&&e.v===0)continue;const k=groupById(e.groupId)?e.groupId:'-';byG[k]=(byG[k]||0)+e.v}
  const gs=Object.entries(byG).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="card"><h3>Pro Gruppe (nächste ${ui.fcMonths} Monate)</h3><table>${gs.map(([k,v])=>`<tr><td><span class="dot" style="display:inline-block;background:${gColor(k)}"></span> ${esc(gName(k))}</td><td class="num ${v<0?'exp':'inc'}">${fmt(v)}</td></tr>`).join('')||'<tr><td class="muted">Keine geplanten Zahlungen.</td></tr>'}</table></div>`;
  return h;
}
function chartSvg(f){
  const pts=[f.start,...f.rows.map(r=>r.end)],W=600,H=210,L=58,R=10,T=12,B=26;
  const mn=Math.min(0,...pts),mx=Math.max(0,...pts),span=(mx-mn)||1;
  const x=i=>L+(W-L-R)*i/(pts.length-1||1),y=v=>T+(H-T-B)*(1-(v-mn)/span);
  const line=pts.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const area=`${x(0)},${y(Math.max(mn,0))} ${line} ${x(pts.length-1)},${y(Math.max(mn,0))}`;
  const ticks=[mn,mn+span/2,mx].map(v=>`<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v).toLocaleString('de-CH')}</text><line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('');
  const step=Math.ceil(f.rows.length/8);
  const lab=f.rows.map((r,i)=>i%step===0?`<text x="${x(i+1)}" y="${H-8}" text-anchor="middle">${MON[+r.ym.slice(5)-1]} ${r.ym.slice(2,4)}</text>`:'').join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kontostand-Prognose">${ticks}${mn<0?`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--exp)" stroke-dasharray="4 4"/>`:''}<polygon points="${area}" fill="var(--brand)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${v<0?'var(--exp)':'var(--brand)'}"/>`).join('')}${lab}</svg><div class="small muted">Kontostand jeweils Ende Monat</div>`;
}

  <div class="card"><h3>Gruppen</h3>${liveGroups().map(g=>`<div class="item" onclick="editGroup('${g.id}')"><span class="dot" style="background:${g.color}"></span><div class="t"><b>${esc(g.name)}</b><span class="small muted">${{einnahme:'Einnahmen',ausgabe:'Ausgaben',gemischt:'Gemischt'}[g.type]||''}</span></div></div>`).join('')}

   <label>Dein Name (erscheint in der Änderungsliste)<input name="name" value="${esc(cfg.name)}" placeholder="z.B. Matthias"></label>
   <div class="row"><label>GitHub-Benutzername<input name="owner" value="${esc(cfg.owner)}" autocapitalize="off" autocorrect="off"></label><label>Daten-Repository<input name="repo" value="${esc(cfg.repo||'haushaltsbuch-daten')}" autocapitalize="off" autocorrect="off"></label></div>
   <div class="row"><label>Branch<input name="branch" value="${esc(cfg.branch||'main')}" autocapitalize="off"></label><label>Datei<input name="path" value="${esc(cfg.path||'daten.json')}" autocapitalize="off"></label></div>
   <label>Zugriffs-Token<input name="token" type="password" value="${esc(cfg.token)}" autocomplete="off" placeholder="github_pat_…"></label>
   <div class="mfoot"><button class="btn pri">Speichern &amp; verbinden</button>${syncOn()?`<button type="button" class="btn" onclick="syncNow()">Jetzt synchronisieren</button><span class="sp"></span><button type="button" class="btn del" onclick="disconnect()">Trennen</button>`:''}</div>
  </form>
  <div class="card"><h3 style="margin-bottom:8px">Sicherung</h3>

function saveCfg(e){
  e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));
  cfg={name:fd.name.trim(),owner:fd.owner.trim(),repo:fd.repo.trim(),branch:fd.branch.trim()||'main',path:fd.path.trim()||'daten.json',token:fd.token.trim()};
  lsSet(LS_CFG,JSON.stringify(cfg));syncErr='';lastSync=null;render();syncNow();
}
function disconnect(){if(!confirm('Verbindung auf diesem Gerät trennen? Die Daten bleiben auf GitHub erhalten.'))return;cfg={name:cfg.name};lsSet(LS_CFG,JSON.stringify(cfg));syncErr='';render()}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='haushaltsbuch-'+today()+'.json';a.click()}
function importJson(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.accounts)throw 0;data=merge(data,d);commit();alert('Import abgeschlossen.')}catch(e){alert('Die Datei ist keine gültige Haushaltsbuch-Sicherung.')}};
  r.readAsText(f);
}

/* ================= Formulare ================= */
let modalSave=null,modalDel=null;
function openModal(title,html,onSave,onDel,delLabel){
  modalSave=onSave;modalDel=onDel;
  const m=document.getElementById('modal');
  m.innerHTML=`<form onsubmit="submitModal(event)" novalidate><h2>${title}</h2>${html}<div class="mfoot"><button class="btn pri">Speichern</button><button type="button" class="btn" onclick="closeModal()">Abbrechen</button><span class="sp"></span>${onDel?`<button type="button" class="btn del" onclick="if(modalDel()!==false)closeModal()">${delLabel||'Löschen'}</button>`:''}</div></form>`;
  trToggle(m.querySelector('form'));m.classList.add('open');m.onclick=e=>{if(e.target===m)closeModal()};
}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';render()}
function submitModal(e){e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));fd._form=e.target;if(modalSave(fd)!==false)closeModal()}
const fKind=k=>`<div class="seg" onchange="trToggle(this.closest('form'))"><label><input type="radio" name="kind" value="ausgabe" ${k!=='einnahme'&&k!=='transfer'?'checked':''}>Ausgabe</label><label><input type="radio" name="kind" value="einnahme" ${k==='einnahme'?'checked':''}>Einnahme</label><label><input type="radio" name="kind" value="transfer" ${k==='transfer'?'checked':''}>Übertrag</label></div>`;
function trToggle(f){if(!f||!f.kind)return;const tr=f.kind.value==='transfer';f.querySelectorAll('.tronly').forEach(e=>e.style.display=tr?'':'none');f.querySelectorAll('.acclbl').forEach(e=>e.textContent=tr?'Von Konto':'Konto')}
const fGroup=id=>`<label>Gruppe<select name="groupId" onchange="const t=this.selectedOptions[0].dataset.t;if(this.form.kind.value!=='transfer'&&(t==='einnahme'||t==='ausgabe'))this.form.querySelector('[name=kind][value='+t+']').checked=true"><option value="">Ohne Gruppe</option>${liveGroups().map(g=>`<option value="${g.id}" data-t="${g.type}" ${g.id===id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>`;
function fAcc(id,to){
  const acc=liveAcc();
  if(acc.length<2)return`<input type="hidden" name="accountId" value="${acc[0]?.id||''}"><p class="hint tronly">Für einen Übertrag braucht es mindestens zwei Konten. Lege unter ⚙️ Einstellungen z.B. «Sparkonto Ferien» oder «Sparkonto Steuern» an.</p>`;
  if(!to||to===id)to=(acc.find(a=>a.id!==id&&/spar/i.test(a.name))||acc.find(a=>a.id!==id))?.id;
  const opts=sel=>acc.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
  return`<div class="row"><label><span class="acclbl">Konto</span><select name="accountId">${opts(id)}</select></label><label class="tronly">Auf Konto<select name="toAccountId">${opts(to)}</select></label></div>`;
}
function needAcc(){if(!liveAcc().length){alert('Bitte zuerst unter Einstellungen ein Konto anlegen.');go('set');return false}return true}
function checkBasics(fd){
  if(!fd.title.trim()){alert('Bitte einen Titel eingeben.');return null}
  const amt=parseAmount(fd.amount);if(isNaN(amt)||amt===0){alert('Bitte einen gültigen Betrag eingeben.');return null}
  if(fd.kind==='transfer'&&(!fd.toAccountId||fd.toAccountId===fd.accountId)){alert(liveAcc().length<2?'Bitte zuerst ein zweites Konto anlegen.':'Bitte zwei verschiedene Konten wählen.');return null}
  return{toAccountId:fd.kind==='transfer'?fd.toAccountId:'',title:fd.title.trim(),kind:fd.kind,amount:Math.abs(amt),groupId:fd.groupId||'',accountId:fd.accountId,note:(fd.note||'').trim()};
}

function editBooking(id){
  if(!needAcc())return;
  const b=id?data.bookings.find(x=>x.id===id):{date:today(),title:'',kind:'ausgabe',amount:'',groupId:ui.fg&&ui.fg!=='-'?ui.fg:'',accountId:ui.fa||liveAcc()[0].id,note:''};
  if(!id&&b.groupId){const g=groupById(b.groupId);if(g?.type==='einnahme')b.kind='einnahme'}
  openModal(id?'Buchung bearbeiten':'Neue Buchung',`${fKind(b.kind)}
   <label>Titel<input name="title" value="${esc(b.title)}" placeholder="z.B. Krankenkasse, Lohn, Mieteinnahme"></label>
   <div class="row"><label>Betrag CHF<input name="amount" inputmode="decimal" value="${b.amount===''?'':Number(b.amount).toFixed(2)}"></label><label>Datum<input type="date" name="date" value="${b.date}"></label></div>
   ${fGroup(b.groupId)}${fAcc(b.accountId,b.toAccountId)}
   <label>Notiz<input name="note" value="${esc(b.note)}"></label>
   ${b.orderId?'<p class="hint">Diese Buchung stammt aus einem Dauerauftrag. Änderungen hier betreffen nur diese eine Buchung.</p>':''}
   ${b.date>today()?'<p class="hint">Liegt in der Zukunft und wird in der Prognose berücksichtigt.</p>':''}
   ${b.by?`<p class="small muted">Erfasst von ${esc(b.by)}</p>`:''}`,
  fd=>{
    const v=checkBasics(fd);if(!v)return false;if(!fd.date){alert('Bitte ein Datum wählen.');return false}
    if(id)Object.assign(b,v,{date:fd.date,updatedAt:now()});
    else data.bookings.push({id:uid(),...v,date:fd.date,by:cfg.name||'',updatedAt:now()});
    commit();
  },id?()=>{if(!confirm('Buchung löschen?'))return false;b.deleted=true;b.updatedAt=now();commit()}:null);
}

function editOrder(id,groupId){
  if(!needAcc())return;
  const t=today();
  const o=id?data.orders.find(x=>x.id===id):{title:'',kind:'ausgabe',amount:'',freq:'m1',startDate:addDays(t,1),endDate:'',groupId:groupId||'',accountId:liveAcc()[0].id,note:''};
  if(!id&&o.groupId&&groupById(o.groupId)?.type==='einnahme')o.kind='einnahme';
  const nx=id?nextOcc(o,addDays(t,1)):null;
  openModal(id?'Dauerauftrag bearbeiten':'Neuer Dauerauftrag',`${fKind(o.kind)}
   <label>Titel<input name="title" value="${esc(o.title)}" placeholder="z.B. Miete, Lohn, Sparen Ferien"></label>
   <div class="row"><label>Betrag CHF<input name="amount" inputmode="decimal" value="${o.amount===''?'':Number(o.amount).toFixed(2)}"></label>
   <label>Rhythmus<select name="freq">${Object.entries(FREQ).map(([k,f])=>`<option value="${k}" ${o.freq===k?'selected':''}>${f.l}</option>`).join('')}</select></label></div>
   <div class="row"><label>Erste Ausführung<input type="date" name="startDate" value="${o.startDate}"></label><label>Letzte bis (optional)<input type="date" name="endDate" value="${o.endDate||''}"></label></div>
   <p class="small muted" style="margin:-4px 0 10px">Bei „Quartalsweise“ mit erster Ausführung am 31.03. folgen 30.06., 30.09., 31.12. usw.</p>
   ${fGroup(o.groupId)}${fAcc(o.accountId,o.toAccountId)}
   <label>Notiz<input name="note" value="${esc(o.note)}"></label>
   ${id?`<label>Änderung gilt ab<input type="date" name="effective" value="${nx&&nx>t?nx:t}"></label>
     <p class="hint">Bereits gebuchte Ausführungen bleiben unverändert. Liegt das Datum in der Zukunft, läuft der alte Auftrag bis dahin weiter und der geänderte gilt ab diesem Tag.</p>`
   :`<label class="chk"><input type="checkbox" name="backfill"> Ausführungen vor heute als Buchungen nachtragen</label>`}`,
  fd=>{
    const v=checkBasics(fd);if(!v)return false;
    if(!fd.startDate){alert('Bitte das Datum der ersten Ausführung wählen.');return false}
    if(fd.endDate&&fd.endDate<fd.startDate){alert('Das Enddatum liegt vor der ersten Ausführung.');return false}
    Object.assign(v,{freq:fd.freq,startDate:fd.startDate,endDate:fd.freq==='once'?null:(fd.endDate||null)});
    if(!id){data.orders.push({id:uid(),...v,bookedUntil:fd.backfill?null:addDays(t,-1),by:cfg.name||'',updatedAt:now()});commit();return}
    const eff=fd.effective||t;
    if(eff>t&&eff>o.startDate&&o.freq!=='once'&&v.freq!=='once'){
      const ns=v.startDate>=eff?v.startDate:nextOcc(v,eff);
      if(ns){
        const lastOld=addDays(eff,-1);
        o.endDate=o.endDate&&o.endDate<lastOld?o.endDate:lastOld;o.updatedAt=now();
        data.orders.push({id:uid(),...v,startDate:ns,bookedUntil:null,prevId:o.id,by:cfg.name||'',updatedAt:now()});
        commit();return;
      }
    }
    Object.assign(o,v,{updatedAt:now()});commit();
  },id?()=>{if(!confirm('Dauerauftrag löschen? Bereits gebuchte Zahlungen bleiben in den Buchungen erhalten.'))return false;o.deleted=true;o.updatedAt=now();commit()}:null);
}

function editGroup(id){
  const g=id?data.groups.find(x=>x.id===id):{name:'',type:'ausgabe',color:'#2f6fb5'};
  openModal(id?'Gruppe bearbeiten':'Neue Gruppe',`
   <label>Name<input name="name" value="${esc(g.name)}" placeholder="z.B. Wohnen, Kinder, Ferien"></label>
   <div class="row"><label>Art<select name="type"><option value="ausgabe" ${g.type==='ausgabe'?'selected':''}>Ausgaben</option><option value="einnahme" ${g.type==='einnahme'?'selected':''}>Einnahmen</option><option value="gemischt" ${g.type==='gemischt'?'selected':''}>Gemischt</option></select></label>
   <label>Farbe<input type="color" name="color" value="${g.color}" style="height:42px;padding:3px"></label></div>`,
  fd=>{
    if(!fd.name.trim()){alert('Bitte einen Namen eingeben.');return false}
    const v={name:fd.name.trim(),type:fd.type,color:fd.color};
    if(id)Object.assign(g,v,{updatedAt:now()});else data.groups.push({id:uid(),...v,updatedAt:now()});
    commit();
  },id?()=>{if(!confirm('Gruppe löschen? Die Einträge darin bleiben erhalten und erscheinen unter „Ohne Gruppe“.'))return false;g.deleted=true;g.updatedAt=now();commit()}:null);
}

function editAccount(id){
  const a=id?data.accounts.find(x=>x.id===id):{name:'',startBalance:0,startDate:today()};
  openModal(id?'Konto bearbeiten':'Neues Konto',`
   <label>Titel<input name="name" value="${esc(a.name)}" placeholder="z.B. Haushaltskonto"></label>
   <div class="row"><label>Kontostand CHF<input name="startBalance" inputmode="decimal" value="${Number(a.startBalance||0).toFixed(2)}"></label><label>per Datum<input type="date" name="startDate" value="${a.startDate}"></label></div>
   <p class="hint">Trage den Kontostand gemäss Bank an einem Stichtag ein. Buchungen ab diesem Datum werden dazugerechnet.</p>`,
  fd=>{
    if(!fd.name.trim()){alert('Bitte einen Titel eingeben.');return false}
    const sb=parseAmount(fd.startBalance);if(isNaN(sb)){alert('Bitte einen gültigen Kontostand eingeben.');return false}
    const v={name:fd.name.trim(),startBalance:sb,startDate:fd.startDate||today()};
    if(id)Object.assign(a,v,{updatedAt:now()});else data.accounts.push({id:uid(),...v,updatedAt:now()});
    commit();
  },id?()=>{if(!confirm('Konto löschen? Seine Buchungen werden dann nicht mehr angezeigt.'))return false;a.deleted=true;a.updatedAt=now();commit()}:null);
}

materialize();saveLocal();render();syncNow();
setInterval(()=>{if(materialize()){saveLocal();render();syncNow()}},60*60*1000);
</script>
